name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Stop xcodebuild from buffering its output when piped, so the log streams live.
      NSUnbufferedIO: 'YES'
      # No certificates on the runner: sign ad hoc ("Sign to Run Locally").
      XCODEBUILD: xcodebuild -project PowerToys.xcodeproj -scheme PowerToys -destination platform=macOS CODE_SIGN_IDENTITY=-

    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test
        run: set -o pipefail && $XCODEBUILD test 2>&1 | xcbeautify --renderer github-actions

      - name: Build (Release)
        run: set -o pipefail && $XCODEBUILD -configuration Release build 2>&1 | xcbeautify --renderer github-actions
